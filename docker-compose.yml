services:

  ##################################################
  # POSTGRESQL
  ##################################################

  postgres:

    image: postgres:16

    container_name: fraud_postgres

    environment:
      POSTGRES_USER: fraud_admin
      POSTGRES_PASSWORD: fraud_password
      POSTGRES_DB: fraud_detection

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data:/data

    networks:
      - fraud_network

    restart: unless-stopped


  ##################################################
  # PYSPARK NOTEBOOK
  ##################################################

  pyspark:

    build:
      context: .
      dockerfile: Dockerfile.spark

    container_name: pyspark_lab

    ports:
      - "8888:8888"
      - "4040:4040"

    environment:
      - JUPYTER_ENABLE_LAB=yes

    volumes:
      - ./spark:/home/jovyan/work

    networks:
      - fraud_network

    restart: unless-stopped


  ##################################################
  # AIRFLOW INIT
  ##################################################

  airflow-init:

    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow_init

    depends_on:
      - postgres

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fraud_admin:fraud_password@postgres/fraud_detection
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./spark:/opt/spark
      - /var/run/docker.sock:/var/run/docker.sock

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Gabriel
      --lastname Ferreira
      --role Admin
      --email admin@airflow.com
      "

    networks:
      - fraud_network


  ##################################################
  # AIRFLOW WEBSERVER
  ##################################################

  airflow-webserver:

    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow_webserver

    depends_on:
      - airflow-init

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fraud_admin:fraud_password@postgres/fraud_detection
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1

    ports:
      - "8080:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./spark:/opt/spark
      - /var/run/docker.sock:/var/run/docker.sock

    command: webserver

    networks:
      - fraud_network

    restart: unless-stopped


  ##################################################
  # AIRFLOW SCHEDULER
  ##################################################

  airflow-scheduler:

    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow_scheduler

    depends_on:
      - airflow-init

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fraud_admin:fraud_password@postgres/fraud_detection
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./spark:/opt/spark
      - /var/run/docker.sock:/var/run/docker.sock

    command: scheduler

    networks:
      - fraud_network

    restart: unless-stopped


##################################################
# NETWORKS
##################################################

networks:
  fraud_network:
    driver: bridge


##################################################
# VOLUMES
##################################################

volumes:
  postgres_data: